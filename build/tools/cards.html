<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Картотека — Развернутый Мир</title>
<link rel="icon" href="data:,">
<!-- ОТДЕЛЬНАЯ ОТ ИГРЫ программка (открывается двойным кликом): читает
     чистые данные карт (scripts/game/cardsData.js) и локализацию (loc.js).
     Просмотр всех карт по фильтрам + конструктор колод с сохранением
     в файл и в память браузера. Никаких fetch — только <script>/img. -->
<style>
    @font-face {
        font-family: "Kereru";
        src: url("../font/Kereru.otf") format("opentype");
    }
    :root {
        --bg: #16110c; --panel: #221b12; --panel2: #2b2216; --line: #453723;
        --text: #d8c79d; --dim: #8a7c5e; --gold: #f0c96a; --red: #ff8f6e;
        --green: #9ec46a;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 15px/1.45 "Kereru", "Segoe UI", serif;
    }
    button {
        font: inherit; color: var(--text); background: var(--panel2);
        border: 1px solid var(--line); border-radius: 6px;
        padding: 4px 10px; cursor: pointer;
    }
    button:hover { border-color: var(--gold); color: var(--gold); }
    button.on { background: #3d2f1a; border-color: var(--gold); color: var(--gold); }
    input, select {
        font: inherit; color: var(--text); background: #1a140d;
        border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
    }
    input:focus, select:focus { outline: none; border-color: var(--gold); }

    header {
        display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
        padding: 10px 16px 6px;
    }
    header h1 { margin: 0; font-size: 26px; color: var(--gold); letter-spacing: 1px; }
    header .sub { color: var(--dim); font-size: 13px; }
    header .spacer { flex: 1; }

    #filters {
        display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
        padding: 4px 16px 10px; border-bottom: 1px solid var(--line);
    }
    #filters .lbl { color: var(--dim); font-size: 13px; }
    #statusLine { padding: 6px 16px 0; color: var(--dim); font-size: 13px; }

    #main { display: flex; align-items: flex-start; }
    #gridWrap { flex: 1; padding: 10px 16px 40px; }
    #grid { display: flex; flex-wrap: wrap; gap: 12px; }

    .tile {
        position: relative; width: 146px; border-radius: 9px; cursor: pointer;
        transition: transform .12s;
    }
    .tile:hover { transform: translateY(-3px); }
    .tile img { width: 146px; display: block; border-radius: 9px; }
    .tile .face {
        width: 146px; height: 214px; border-radius: 9px; border: 1px solid var(--line);
        background-size: cover; background-position: center; position: relative;
    }
    .tile .tokName {
        position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
        font-size: 12px; color: #ffe9c2; text-shadow: 0 1px 3px #000, 0 0 6px #000;
        padding: 0 4px;
    }
    .tile .inDeck {
        position: absolute; top: -7px; right: -7px; min-width: 22px; height: 22px;
        background: var(--gold); color: #241505; border-radius: 11px;
        font-size: 13px; line-height: 22px; text-align: center; padding: 0 5px;
        box-shadow: 0 1px 4px #000;
    }
    .tile .addBtn {
        position: absolute; top: 4px; right: 4px; display: none;
        width: 26px; height: 26px; padding: 0; font-size: 17px; line-height: 1;
        background: rgba(20, 14, 6, .85);
    }
    .tile:hover .addBtn { display: block; }

    /* ── правая колонка: конструктор колод ─────────────────────────────── */
    #deckPane {
        width: 330px; flex-shrink: 0; margin: 10px 16px 40px 0;
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 12px 14px; position: sticky; top: 8px;
    }
    #deckPane h2 {
        margin: 0 0 8px; font-size: 19px; color: var(--gold); letter-spacing: 1px;
        display: flex; align-items: baseline; gap: 8px;
    }
    #deckTotal { font-size: 14px; color: var(--dim); }
    #deckTotal.bad { color: var(--red); }
    #deckTotal.few { color: var(--gold); }
    #deckName { width: 100%; margin-bottom: 8px; }
    #deckList {
        max-height: 300px; overflow-y: auto; border: 1px solid var(--line);
        border-radius: 8px; background: #1a140d; margin-bottom: 8px;
    }
    .drow {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 8px; border-bottom: 1px solid #241c11; font-size: 14px;
    }
    .drow:last-child { border-bottom: none; }
    .drow .cost { color: var(--dim); width: 26px; text-align: right; flex-shrink: 0; }
    .drow .nm { flex: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .drow .nm:hover { color: var(--gold); }
    .drow .cnt { color: var(--gold); width: 30px; text-align: center; flex-shrink: 0; }
    .drow button { padding: 0 8px; font-size: 14px; line-height: 20px; }
    #deckEmpty { color: var(--dim); text-align: center; padding: 18px 8px; font-size: 13px; }
    #curve { display: flex; align-items: flex-end; gap: 4px; height: 52px; margin: 6px 0 10px; }
    #curve .bar { flex: 1; background: #3d2f1a; border-radius: 3px 3px 0 0; position: relative; min-height: 2px; }
    #curve .bar i {
        position: absolute; top: -16px; left: 0; right: 0; text-align: center;
        font-style: normal; font-size: 11px; color: var(--dim);
    }
    #curve .bar b { position: absolute; bottom: -15px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--dim); font-weight: normal; }
    .btnRow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .btnRow button { flex: 1; white-space: nowrap; }
    #slots { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
    #slots h3 { margin: 0 0 6px; font-size: 15px; color: var(--dim); font-weight: normal; }
    .slot { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 14px; }
    .slot .nm { flex: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot .nm:hover { color: var(--gold); }
    .slot .info { color: var(--dim); font-size: 12px; flex-shrink: 0; }
    .slot button { padding: 0 7px; font-size: 12px; }
    #slotEmpty { color: var(--dim); font-size: 13px; }

    /* ── вкладка персонажей ────────────────────────────────────────────── */
    #heroFilters {
        display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
        padding: 12px 16px 0;
    }
    #heroFilters .lbl { color: var(--dim); font-size: 13px; }
    #heroGrid { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px 16px 40px; }
    .htile { width: 170px; cursor: pointer; transition: transform .12s; }
    .htile:hover { transform: translateY(-3px); }
    .htile img { width: 170px; border-radius: 10px; display: block; }
    .htile .cap { text-align: center; margin-top: 4px; font-size: 14px; }
    .htile .cap small { color: var(--dim); }

    /* ── подробности о карте ───────────────────────────────────────────── */
    #dim { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; z-index: 40; }
    #detail {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
        display: none; z-index: 50; background: var(--panel);
        border: 1px solid var(--gold); border-radius: 12px; padding: 18px;
        max-width: 760px; max-height: 92vh; overflow: auto;
    }
    #detail .cols { display: flex; gap: 18px; }
    #detail img.face { width: 253px; border-radius: 12px; align-self: flex-start; }
    #detail .info { max-width: 420px; }
    #detail h3 { margin: 0 0 6px; color: var(--gold); font-size: 22px; }
    #detail .badges { margin-bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    #detail .badge {
        font-size: 12px; border: 1px solid var(--line); border-radius: 10px;
        padding: 1px 8px; color: var(--dim);
    }
    #detail .stats { font-size: 16px; margin-bottom: 8px; }
    #detail .stats b { color: var(--gold); font-weight: normal; }
    #detail .desc { margin: 0 0 10px; }
    #detail .raw {
        font: 12px/1.5 Consolas, monospace; color: var(--dim);
        border-top: 1px dashed var(--line); padding-top: 8px; white-space: pre-wrap;
    }
    #detailClose { position: absolute; top: 8px; right: 10px; font-size: 16px; }

    #toast {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        background: #3d2f1a; border: 1px solid var(--gold); color: var(--gold);
        border-radius: 8px; padding: 7px 16px; font-size: 14px;
        opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60;
    }
</style>
</head>
<body>
<header>
    <h1>КАРТОТЕКА</h1>
    <span class="sub">Развернутый Мир · данные: scripts/game/cardsData.js</span>
    <span class="spacer"></span>
    <button id="tabCards" class="on"></button>
    <button id="tabHeroes"></button>
    <button id="langBtn"></button>
</header>

<div id="cardsView">
    <div id="filters">
        <input id="q" type="search" style="width: 190px;">
        <span class="lbl" id="lblElem"></span><span id="elemBtns"></span>
        <span class="lbl" id="lblType"></span><span id="typeBtns"></span>
        <span class="lbl" id="lblRarity"></span><span id="rarityBtns"></span>
        <span class="lbl" id="lblSub"></span><span id="subBtns"></span>
        <span class="lbl" id="lblKind"></span><span id="kindBtns"></span>
        <span class="lbl" id="lblCost"></span><span id="costBtns"></span>
        <select id="sortSel"></select>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;">
            <input type="checkbox" id="tokChk" style="cursor:pointer;">
            <span id="tokTxt" style="font-size:13px;"></span>
        </label>
        <button id="resetBtn"></button>
    </div>
    <div id="statusLine"></div>
    <div id="main">
        <div id="gridWrap"><div id="grid"></div></div>
        <div id="deckPane">
            <h2><span id="lblDeck"></span><span id="deckTotal"></span></h2>
            <input id="deckName" type="text">
            <div id="deckList"></div>
            <div id="curve"></div>
            <div class="btnRow">
                <button id="presetStr"></button>
                <button id="presetGrw"></button>
                <button id="presetWis"></button>
                <button id="clearBtn"></button>
            </div>
            <div class="btnRow">
                <button id="saveFile"></button>
                <button id="loadFile"></button>
                <input id="fileInput" type="file" accept=".json,application/json" style="display:none">
            </div>
            <div id="slots">
                <h3 id="lblSlots"></h3>
                <div class="btnRow" style="margin-bottom:6px;">
                    <input id="slotName" type="text" style="flex:1; min-width:100px;">
                    <button id="slotSave"></button>
                </div>
                <div id="slotList"></div>
            </div>
        </div>
    </div>
</div>

<div id="heroView" style="display:none">
    <div id="heroFilters">
        <span class="lbl" id="lblHeroElem"></span><span id="heroElemBtns"></span>
        <span class="lbl" id="lblHeroRarity"></span><span id="heroRarityBtns"></span>
        <select id="heroSortSel"></select>
        <span id="heroStatus" style="color:var(--dim);font-size:13px;"></span>
    </div>
    <div id="heroGrid"></div>
</div>

<div id="dim"></div>
<div id="detail"><button id="detailClose">✕</button><div class="cols" id="detailCols"></div></div>
<div id="toast"></div>

<script src="../scripts/game/cardsData.js"></script>
<script src="../scripts/game/loc.js"></script>
<script>
(function () {
    "use strict";
    const D = globalThis.GAME_CARD_DATA;
    const CARDS = D.CARDS;
    const loc = globalThis.GAME_LOC;
    const t = (k, v) => loc.t(k, v);
    const $ = (id) => document.getElementById(id);

    // ── подписи интерфейса (карточные тексты — из loc.js игры) ──────────
    const UI = {
        ru: {
            title: "Картотека", tabCards: "КАРТЫ", tabHeroes: "ПЕРСОНАЖИ",
            elem: "Стихия:", type: "Тип:", rarity: "Редкость:", cost: "Цена:",
            sub: "Подтип:", tokens: "токены (без лица)",
            subNone: "без подтипа",
            subNames: { goblin: "Гоблин", animal: "Животное", elf: "Эльф",
                plant: "Растение", elemental: "Элементаль", mage: "Маг" },
            kind: "Тип эффекта:",
            kindNames: {
                damage: "Нанесение урона", buff: "Усиление",
                debuff: "Уменьшение параметров", search: "Поиск",
                copy: "Копирование", control: "Контроль", protect: "Защита",
                draw: "Добор карт", discard: "Сброс карт",
                resource: "Получение ресурсов",
                summon: "Появление существ", summonBuilding: "Появление построек",
                castSpell: "Розыгрыш заклинаний",
            },
            all: "все", sort: "Сортировка:", reset: "Сброс",
            sortId: "по каталогу", sortCostAsc: "цена ↑", sortCostDesc: "цена ↓", sortName: "имя",
            sortHpAsc: "жизни ↑", sortHpDesc: "жизни ↓",
            shown: "Показано: {n} из {m}", deck: "КОЛОДА", deckName: "Моя колода",
            deckEmpty: "Колода пуста — кликните «+» на карте",
            maxLine: "{n} / {max} карт", fewLine: "{n} / {max} · минимум {min}",
            presetStr: "Старт: Сила", presetGrw: "Старт: Рост",
            presetWis: "Старт: Мудрость", clear: "Очистить",
            saveFile: "⬇ файл", loadFile: "⬆ файл",
            slots: "Мои колоды (память браузера)", slotSave: "Сохранить",
            slotEmpty: "Пока ничего не сохранено",
            errMax: "В колоде уже {max} карт", errCopies: "«{name}» — уже {n} копий (максимум {m})",
            loaded: "Колода «{name}» загружена: {n} карт", saved: "Сохранено: «{name}»",
            badFile: "Не удалось прочитать файл: {err}", unknownIds: "пропущены неизвестные карты: {ids}",
            copied: "JSON колоды скопирован", heroHp: "♥ базы: {n}",
            noFace: "без лица", stats: "⚡ {cost}  ·  ⚔ {atk}  ·  ♥ {hp}  ·  👟 {spd}",
            statsSpell: "⚡ {cost}", rawTitle: "Параметры:",
        },
        en: {
            title: "Card Files", tabCards: "CARDS", tabHeroes: "HEROES",
            elem: "Element:", type: "Type:", rarity: "Rarity:", cost: "Cost:",
            sub: "Subtype:", tokens: "tokens (no face)",
            subNone: "no subtype",
            subNames: { goblin: "Goblin", animal: "Animal", elf: "Elf",
                plant: "Plant", elemental: "Elemental", mage: "Mage" },
            kind: "Effect:",
            kindNames: {
                damage: "Damage", buff: "Buff", debuff: "Stat reduction",
                search: "Search", copy: "Copy", control: "Control",
                protect: "Protection", draw: "Card draw", discard: "Card discard",
                resource: "Resource gain", summon: "Creature summoning",
                summonBuilding: "Building summoning", castSpell: "Spell casting",
            },
            all: "any", sort: "Sort:", reset: "Reset",
            sortId: "by catalog", sortCostAsc: "cost ↑", sortCostDesc: "cost ↓", sortName: "name",
            sortHpAsc: "health ↑", sortHpDesc: "health ↓",
            shown: "Shown: {n} of {m}", deck: "DECK", deckName: "My deck",
            deckEmpty: "Deck is empty — press «+» on a card",
            maxLine: "{n} / {max} cards", fewLine: "{n} / {max} · min {min}",
            presetStr: "Starter: Strength", presetGrw: "Starter: Growth",
            presetWis: "Starter: Wisdom", clear: "Clear",
            saveFile: "⬇ file", loadFile: "⬆ file",
            slots: "My decks (browser storage)", slotSave: "Save",
            slotEmpty: "Nothing saved yet",
            errMax: "Deck already has {max} cards", errCopies: "«{name}» — already {n} copies (max {m})",
            loaded: "Deck «{name}» loaded: {n} cards", saved: "Saved: «{name}»",
            badFile: "Could not read the file: {err}", unknownIds: "skipped unknown cards: {ids}",
            copied: "Deck JSON copied", heroHp: "base ♥: {n}",
            noFace: "no face", stats: "⚡ {cost}  ·  ⚔ {atk}  ·  ♥ {hp}  ·  👟 {spd}",
            statsSpell: "⚡ {cost}", rawTitle: "Parameters:",
        },
    };
    const L = () => UI[loc.lang] || UI.ru;
    const T = (k, v) => { const s = L()[k] !== undefined ? L()[k] : k;
        return v ? Object.keys(v).reduce((acc, key) => acc.split("{" + key + "}").join(v[key]), s) : s; };

    // ── состояние ────────────────────────────────────────────────────────
    const LS = { cur: "carddb.current", decks: "carddb.decks", lang: "carddb.lang" };
    // Фильтры-наборы (w29, просил юзер): пустой набор = «Все», клик по опции
    // включает/выключает её; внутри оси опции складываются (ИЛИ), оси
    // перемножаются (И). Раньше были строки-радио («Обычная» → «Редкая»).
    const state = {
        view: "cards",
        q: "", elem: new Set(), type: new Set(), rarity: new Set(), cost: new Set(), sort: "id",
        // токены (карты без лица/призыва: gobA/gobC/ancBear) в общем каталоге
        // и конструкторе скрыты — включаются галочкой (просил юзер, w25)
        includeTokens: false, subtype: new Set(),
        // тип эффекта заклинания/ловушки (Нанесение урона, Усиление, …) —
        // поле kind из cardsData.js, по спеке юзера (просил юзер, w26)
        kind: new Set(),
        // вкладка «Персонажи»: свои фильтры (стихия/редкость) и сортировка
        // по макс. жизням базы (просил юзер, w25)
        heroElem: new Set(), heroRarity: new Set(), heroSort: "id",
        deck: { name: "", cards: {} }, // id → число копий
    };
    const FILTER_AXES = ["elem", "type", "rarity", "cost", "subtype", "kind",
        "heroElem", "heroRarity"];
    function resetFilterAxes() {
        FILTER_AXES.forEach((k) => state[k].clear());
    }
    function applyFilter(key, value) { // API/совместимость: заменить ось
        if (!FILTER_AXES.includes(key)) { state[key] = value; return; }
        state[key].clear();
        if (value === "all" || value === null || value === undefined) return;
        (Array.isArray(value) ? value : [value]).forEach((v) => {
            // старый API цены «7» = вариант «7+» (в данных максимум 7)
            state[key].add(key === "cost" && String(v) === "7" ? "7+" : v);
        });
    }
    function toggleFilterValue(key, value) {
        if (!FILTER_AXES.includes(key)) return false;
        if (state[key].has(value)) state[key].delete(value);
        else state[key].add(value);
        return true;
    }

    function deckIds() { return Object.keys(state.deck.cards); }
    function deckCount() { return deckIds().reduce((n, id) => n + state.deck.cards[id], 0); }
    const byCostThenName = (a, b) =>
        (CARDS[a].cost - CARDS[b].cost) || nameOf(a).localeCompare(nameOf(b)) || natKey(a).localeCompare(natKey(b));
    function nameOf(id) {
        return CARDS[id] ? t("card." + id + ".name") : id;
    }
    function heroName(id) { // у вражеских карт-героев нет hero.<id>.name — их
        // имя = название энкаунтера (enc.<id>.title)
        const nm = t("hero." + id + ".name");
        return nm === "hero." + id + ".name" ? t("enc." + id + ".title") : nm;
    }
    function natKey(id) { // str2 < str10: каталог с числовым хвостом
        const m = id.match(/^([a-z]+)(\d*)$/i);
        return m ? m[1] + String(m[2] || 0).padStart(6, "0") : id;
    }
    const hex = (n) => "#" + Number(n).toString(16).padStart(6, "0");

    // ── фильтрация и сортировка каталога ────────────────────────────────
    function cardSubtypes(d) { // подтип — ТОЛЬКО явное поле subtype из спеки
        // юзера (for_work/cards.txt): creature в данных — лист поля боя
        // (у ростовских карт плейсхолдер «goblin»), типом существа не является
        return d.subtype ? [d.subtype] : [];
    }
    function subtypeMatch(d) {
        if (!state.subtype.size) return true;
        const subs = cardSubtypes(d);
        if (!subs.length) return state.subtype.has("none");
        return subs.some((s) => state.subtype.has(s));
    }
    function kindsOf(d) { // типы эффекта: строка или список («Шипастые лозы» —
        // Нанесение урона + Уменьшение параметров)
        return Array.isArray(d.kind) ? d.kind : d.kind ? [d.kind] : [];
    }
    function costMatch(cost) {
        if (!state.cost.size) return true;
        for (const c of state.cost) {
            if (c === "7+" ? cost >= 7 : cost === Number(c)) return true;
        }
        return false;
    }
    function filteredIds() {
        const q = state.q.trim().toLowerCase();
        let ids = Object.keys(CARDS).filter((id) => {
            const d = CARDS[id];
            if (!state.includeTokens && !d.img) return false; // токены — по галочке
            if (!subtypeMatch(d)) return false;
            if (state.kind.size && !kindsOf(d).some((k) => state.kind.has(k))) return false;
            if (state.elem.size && !state.elem.has(d.elem)) return false;
            if (state.type.size && !state.type.has(d.type)) return false;
            if (state.rarity.size && !state.rarity.has(d.rarity)) return false;
            if (!costMatch(d.cost)) return false;
            if (q && (nameOf(id).toLowerCase().indexOf(q) < 0
                && t("card." + id + ".desc").toLowerCase().indexOf(q) < 0
                && id.toLowerCase().indexOf(q) < 0)) return false;
            return true;
        });
        const sorts = {
            id: (a, b) => natKey(a) < natKey(b) ? -1 : 1,
            costAsc: byCostThenName,
            costDesc: (a, b) => (CARDS[b].cost - CARDS[a].cost) || byCostThenName(a, b),
            name: (a, b) => {
                const c = nameOf(a).localeCompare(nameOf(b));
                return c || (natKey(a) < natKey(b) ? -1 : 1);
            },
        };
        return ids.sort(sorts[state.sort] || sorts.id);
    }

    // ── сетка карт ──────────────────────────────────────────────────────
    function backOf(elem) { // рубашка токенов без лица — как backTexOf игры
        return elem === "growth" ? "../images/ui/card_nature_back.png"
            : elem === "wisdom" ? "../images/ui/card_wisdom_back.png"
                                 : "../images/ui/card_goblin_back.png";
    }
    function renderGrid() {
        const ids = filteredIds();
        const grid = $("grid");
        grid.textContent = "";
        ids.forEach((id) => {
            const d = CARDS[id];
            const tile = document.createElement("div");

            tile.title = nameOf(id);

                img.src = "../images/cards/" + d.img + ".png";
                img.loading = "lazy";
                tile.appendChild(img);
            } else { // служебные токены: рубашка стихии + имя
                const face = document.createElement("div");
                face.className = "face";
                face.style.backgroundImage = "url(" + backOf(d.elem) + ")";
                const nm = document.createElement("div");
                nm.className = "tokName";
                nm.textContent = nameOf(id);
                face.appendChild(nm);
                tile.appendChild(face);

    // ── конструктор колод ───────────────────────────────────────────────
    function addCard(id) {
        const have = state.deck.cards[id] || 0;
        if (deckCount() >= D.DECK_MAX) return toast(T("errMax", { max: D.DECK_MAX }));
        if (have >= D.DECK_COPIES)
            return toast(T("errCopies", { name: nameOf(id), n: have, m: D.DECK_COPIES }));
        state.deck.cards[id] = have + 1;
        persist(); renderDeck(); renderGrid();
    }
    function removeCard(id) {
        const have = state.deck.cards[id] || 0;
        if (have <= 1) delete state.deck.cards[id];
        else state.deck.cards[id] = have - 1;
        persist(); renderDeck(); renderGrid();
    }
    function renderDeck() {
        const total = deckCount();
        const tot = $("deckTotal");
        tot.textContent = total > D.DECK_MIN ? T("maxLine", { n: total, max: D.DECK_MAX })
            : T("fewLine", { n: total, max: D.DECK_MAX, min: D.DECK_MIN });
        tot.className = total > D.DECK_MAX ? "bad" : total < D.DECK_MIN ? "few" : "";

        const list = $("deckList");
        list.textContent = "";
        const ids = deckIds().sort(byCostThenName);
        if (!ids.length) {
            const empty = document.createElement("div");
            empty.id = "deckEmpty";
            empty.textContent = T("deckEmpty");
            list.appendChild(empty);
        }
        ids.forEach((id) => {
            const row = document.createElement("div");
            row.className = "drow";
            const cost = document.createElement("span");
            cost.className = "cost"; cost.textContent = CARDS[id].cost + "⚡";
            const nm = document.createElement("span");
            nm.className = "nm"; nm.textContent = nameOf(id);
            nm.title = ""; nm.addEventListener("click", () => showCard(id));
            const cnt = document.createElement("span");
            cnt.className = "cnt"; cnt.textContent = "×" + state.deck.cards[id];
            const minus = document.createElement("button"); minus.textContent = "−";
            minus.addEventListener("click", () => removeCard(id));
            const plus = document.createElement("button"); plus.textContent = "+";
            plus.addEventListener("click", () => addCard(id));
            row.append(cost, nm, cnt, minus, plus);
            list.appendChild(row);
        });
        renderCurve();
        $("deckName").value = state.deck.name;
    }
    function renderCurve() { // столбик цены 0..6, 7+
        const counts = {};
        deckIds().forEach((id) => {
            const c = Math.min(CARDS[id].cost, 7);
            counts[c] = (counts[c] || 0) + state.deck.cards[id];
        });
        const max = Math.max(1, ...Object.values(counts));
        const curve = $("curve");
        curve.textContent = "";
        for (let c = 0; c <= 7; c++) {
            const bar = document.createElement("div");
            bar.className = "bar";
            bar.style.height = Math.round((counts[c] || 0) / max * 34 + 2) + "px";
            if (counts[c]) {
                const i = document.createElement("i"); i.textContent = counts[c];
                bar.appendChild(i);
            }
            const b = document.createElement("b"); b.textContent = c === 7 ? "7+" : c;
            bar.appendChild(b);
            curve.appendChild(bar);
        }
    }
    function setDeckFrom(arr, name) { // массив с повторами → карта колоды
        const cards = {};
        for (const id of arr) if (CARDS[id]) cards[id] = (cards[id] || 0) + 1;
        state.deck = { name: name || state.deck.name, cards };
        persist(); renderDeck(); renderGrid();
    }
    function persist() {
        try { localStorage.setItem(LS.cur, JSON.stringify(state.deck)); } catch (e) { /* приватный режим */ }
    }
    function restore() {
        try {
            const raw = localStorage.getItem(LS.cur);
            if (raw) {
                const d = JSON.parse(raw);
                if (d && d.cards) state.deck = { name: d.name || T("deckName"), cards: sanitize(d.cards) };
            }
        } catch (e) { /* битая запись — начинаем с пустой */ }
        if (!state.deck.name) state.deck.name = T("deckName");
    }
    function sanitize(cards) { // чужой JSON: только известные id, капы игры
        const out = {};
        let total = 0;
        for (const id of Object.keys(cards || {})) {
            if (!CARDS[id]) continue;
            const n = Math.min(Number(cards[id]) || 0, D.DECK_COPIES);
            for (let k = 0; k < n && total < D.DECK_MAX; k++, total++) out[id] = (out[id] || 0) + 1;
        }
        return out;
    }

    // ── сохранение/загрузка: файл и память браузера ─────────────────────
    function exportText() {
        return JSON.stringify({ game: "unfolded-world", kind: "deck", version: 1,
            name: state.deck.name, cards: state.deck.cards,
            saved: new Date().toISOString() }, null, 2);
    }
    function importText(text) { // понимает и {cards:{…}}, и плоский массив id
        let data;
        try { data = JSON.parse(text); } catch (e) { return { ok: false, err: String(e) }; }
        const arr = Array.isArray(data) ? data
            : Array.isArray(data && data.cards) ? data.cards
            : data && data.cards && typeof data.cards === "object" ? null : data;
        const skipped = [];
        let cards;
        if (arr) {
            cards = {};
            arr.forEach((id) => { if (CARDS[id]) cards[id] = (cards[id] || 0) + 1; else skipped.push(id); });
            cards = sanitize(cards);
        } else {
            cards = sanitize(data.cards);
            skipped.push.apply(skipped, Object.keys(data.cards).filter((id) => !CARDS[id]));
        }
        state.deck = { name: (data && data.name) || state.deck.name, cards };
        persist(); renderDeck(); renderGrid();
        if (skipped.length) toast(T("unknownIds", { ids: skipped.join(", ") }));
        return { ok: true, skipped };
    }

        a.download = "deck-" + state.deck.name.replace(/[^\wа-яёА-ЯЁ\- ]+/gi, "").trim()
            .replace(/\s+/g, "_") + ".json";
        document.body.appendChild(a); a.click(); a.remove();

    // ── фильтры: сборка контролов ───────────────────────────────────────
    // redraw — что перерисовать после выбора (карты или вкладка героев)
    function chip(parent, label, isOn, onPick, redraw) {
        const b = document.createElement("button");
        b.textContent = label;
        if (isOn) b.className = "on";
        b.addEventListener("click", () => {
            onPick();
            (redraw || (() => { renderFilters(); renderGrid(); }))();
        });
        parent.appendChild(b);
        return b;
    }
    // Ось фильтра: «Все» = пустой набор, опции — независимые переключатели
    function chipSet(parent, values, set, labelOf, redraw) {
        parent.textContent = "";
        const all = chip(parent, T("all"), set.size === 0, () => set.clear(), redraw);
        all.dataset.filterValue = "all"; // для проб и отладки
        values.forEach((v) => {
            const b = chip(parent, labelOf(v), set.has(v), () => {
                if (set.has(v)) set.delete(v);
                else set.add(v);
            }, redraw);
            b.dataset.filterValue = String(v);
        });
    }
    function renderFilters() {
        const elems = Object.keys(CARDS).reduce((acc, id) => {
            if (!acc.includes(CARDS[id].elem)) acc.push(CARDS[id].elem);
            return acc; }, []);
        chipSet($("elemBtns"), elems, state.elem, (e) => t("elem." + e));
        chipSet($("typeBtns"), ["unit", "spell", "building", "trap"],
            state.type, (tp) => t("type." + tp));
        chipSet($("rarityBtns"), ["common", "rare", "epic"],
            state.rarity, (r) => t("rarity." + r));
        chipSet($("subBtns"), ["goblin", "animal", "elf", "plant", "elemental", "none"],
            state.subtype, (s) => s === "none" ? T("subNone") : T("subNames")[s]);
        chipSet($("kindBtns"), ["damage", "buff", "debuff", "search", "copy", "control",
            "protect", "draw", "discard", "resource", "summon", "summonBuilding", "castSpell"],
            state.kind, (k) => T("kindNames")[k]);
        // цена: 0..6 + «7+» (в данных пока максимум 7); опции складываются
        const costs = [...new Set(Object.keys(CARDS).map((id) => CARDS[id].cost))]
            .sort((a, b) => a - b).filter((c) => c < 7).map(String);
        chipSet($("costBtns"), [...costs, "7+"], state.cost, (c) => c);
        $("tokChk").checked = state.includeTokens;
        $("q").value = state.q;
        $("sortSel").value = state.sort;
        $("tabCards").className = state.view === "cards" ? "on" : "";
        $("tabHeroes").className = state.view === "heroes" ? "on" : "";
    }
    // фильтры вкладки «Персонажи» (просил юзер, w25): стихия, редкость,
    // сортировка по макс. жизням базы
    function heroIds() {
        const all = [...D.HERO_ORDER, ...D.HERO_FOE_ORDER].filter((id) => D.HEROES[id]);
        const f = all.filter((id) => {
            const d = D.HEROES[id];
            if (state.heroElem.size && !d.elems.some((e) => state.heroElem.has(e))) return false;
            if (state.heroRarity.size && !state.heroRarity.has(d.rarity)) return false;
            return true;
        });
        const sorts = {
            id: null,
            hpAsc: (a, b) => D.HEROES[a].baseHp - D.HEROES[b].baseHp,
            hpDesc: (a, b) => D.HEROES[b].baseHp - D.HEROES[a].baseHp,
        };
        return sorts[state.heroSort] ? f.sort(sorts[state.heroSort]) : f;
    }
    function renderHeroFilters() {
        const elems = Object.keys(D.HEROES).reduce((acc, id) => {
            D.HEROES[id].elems.forEach((e) => { if (!acc.includes(e)) acc.push(e); });
            return acc; }, []);
        chipSet($("heroElemBtns"), elems, state.heroElem,
            (e) => t("elem." + e), renderHeroesView);
        chipSet($("heroRarityBtns"), ["common", "rare", "epic"], state.heroRarity,

        $("tabCards").className = state.view === "cards" ? "on" : "";
        $("tabHeroes").className = state.view === "heroes" ? "on" : "";
    }

    $("presetStr").addEventListener("click", () =>
        setDeckFrom(D.STARTER_DECKS.strength, t("elem.strength")));
    $("presetGrw").addEventListener("click", () =>
        setDeckFrom(D.STARTER_DECKS.growth, t("elem.growth")));
    $("presetWis").addEventListener("click", () =>
        setDeckFrom(D.STARTER_DECKS.wisdom, t("elem.wisdom")));
    $("clearBtn").addEventListener("click", () => {
        state.deck.cards = {}; persist(); renderDeck(); renderGrid();
    });
    $("tabCards").addEventListener("click", () => setView("cards"));
    $("tabHeroes").addEventListener("click", () => setView("heroes"));
    function setView(v) {
        state.view = v;
        $("cardsView").style.display = v === "cards" ? "" : "none";
        $("heroView").style.display = v === "heroes" ? "" : "none";
        renderFilters();
        if (v === "heroes") renderHeroesView();
    }
    $("langBtn").addEventListener("click", () => {
        const next = loc.lang === "ru" ? "en" : "ru";
        loc.setLang(next);
        try { localStorage.setItem(LS.lang, next); } catch (e) { /* приватный режим */ }
        applyLang();
    });

    function applyLang() {
        $("langBtn").textContent = loc.lang === "ru" ? "RU → EN" : "EN → RU";
        buildStatic();
        renderFilters();
        renderGrid();
        renderDeck();
        renderSlots();
        if (state.view === "heroes") renderHeroesView();
    }

    // ── тестовый API (пробы через CDP) ──────────────────────────────────
    globalThis.__CARDSDB = {
        state: () => ({ view: state.view, lang: loc.lang,
            filter: { q: state.q, elem: [...state.elem], type: [...state.type],
                rarity: [...state.rarity], cost: [...state.cost], sort: state.sort,
                subtype: [...state.subtype], kind: [...state.kind],
                includeTokens: state.includeTokens,
                heroElem: [...state.heroElem], heroRarity: [...state.heroRarity],
                heroSort: state.heroSort },
            shown: filteredIds().length, total: Object.keys(CARDS).length,
            heroesShown: state.view === "heroes" ? heroIds().length : undefined,
            deck: { name: state.deck.name, count: deckCount(),
                cards: JSON.parse(JSON.stringify(state.deck.cards)) },
            slots: Object.keys(slots()) }),
        // совместимость со старыми пробами: строка заменяет ось, «all» —
        // сброс; массив задаёт несколько значений сразу
        setFilter: (patch) => {
            Object.entries(patch).forEach(([k, v]) => applyFilter(k, v));
            if (state.view === "heroes") renderHeroesView();
            else { renderFilters(); renderGrid(); }
        },
        toggleFilter: (key, value) => {
            if (!toggleFilterValue(key, value)) return false;
            if (state.view === "heroes") renderHeroesView();
            else { renderFilters(); renderGrid(); }
            return true;
        },
        clearFilters: () => {
            resetFilterAxes();
            if (state.view === "heroes") renderHeroesView();
            else { renderFilters(); renderGrid(); }
        },
        heroIds: () => heroIds(),
        deckIds: () => filteredIds(),
        add: addCard, remove: removeCard,
        clear: () => { state.deck.cards = {}; persist(); renderDeck(); renderGrid(); },
        preset: (k) => setDeckFrom(D.STARTER_DECKS[k], t("elem." + k)),
        saveSlot: (nm) => { const all = slots();
            all[nm] = { cards: state.deck.cards, saved: new Date().toISOString() };
            localStorage.setItem(LS.decks, JSON.stringify(all)); renderSlots(); },
        loadSlot: (nm) => { const s = slots()[nm]; if (!s) return false;
            state.deck = { name: nm, cards: sanitize(s.cards) };
            persist(); renderDeck(); renderGrid(); return true; },
        exportText, importText,
        setLang: (l) => { loc.setLang(l); applyLang(); },
        show: showCard, hide: hideDetail,
        toast,
    };

    // ── всплывающая подсказка ───────────────────────────────────────────
    let toastTimer = 0;
    function toast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.style.opacity = "1";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2600);
    }

    // ── старт ───────────────────────────────────────────────────────────
    try {
        const saved = localStorage.getItem(LS.lang);
        if (saved && saved !== loc.lang) loc.setLang(saved);
    } catch (e) { /* приватный режим */ }
    restore();
    applyLang();
})();
</script>
</body>
</html>
